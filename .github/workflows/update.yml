name: Update J.League data

on:
  schedule:
    - cron: "0 22 * * *" # daily 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect official J1/J2 fixtures and results
        run: python -X utf8 collect.py --season 2026 --out data
      - name: Record the daily simulation snapshot
        run: node snapshot.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update J.League data $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
